<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>三本柱單手 Demo</title>
<style>
  :root { --bg:#1e1a24; --fg:#f3eee6; --line:#5a4d66; --accent:#f5892a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body {
    display:flex; flex-direction:column; align-items:center;
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  header { display:flex; gap:6px; padding:10px 8px 6px; flex-wrap:wrap; justify-content:center; }
  header button {
    font:inherit; font-size:14px; padding:7px 11px; border-radius:8px;
    border:1px solid var(--line); background:#2c2535; color:var(--fg); cursor:pointer;
  }
  header button.on { background:var(--accent); border-color:var(--accent); color:#1e1a24; font-weight:700; }
  #snd { opacity:.8; }
  #help { font-size:13px; line-height:1.45; opacity:.85; padding:0 16px 8px; text-align:center; max-width:440px; }
  #wrap { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:flex-start; padding-bottom:8px; box-sizing:border-box; }
  canvas { display:block; touch-action:none; border-radius:12px; }
</style>
</head>
<body>
<header>
  <button data-m="D">來回巴掌</button>
  <button data-m="E">隔板冒頭</button>
  <button data-m="F">一路打下班</button>
  <button id="snd">音效 開</button>
</header>
<div id="help"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script type="module">
import { build, Grid } from './sprites.js';

// ================= 畫布 =================
const LW = 360, LH = 640;
const FONT = '-apple-system, "PingFang TC", "Noto Sans TC", sans-serif';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const helpEl = document.getElementById('help');
let K = 1;
function resize() {
  const wrap = document.getElementById('wrap');
  const s = Math.min(Math.min(innerWidth, 520) / LW, (wrap.clientHeight - 8) / LH);
  cv.style.width = LW * s + 'px';
  cv.style.height = LH * s + 'px';
  K = s * (devicePixelRatio || 1);
  cv.width = Math.round(LW * K);
  cv.height = Math.round(LH * K);
}
addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;

// ================= 精靈圖 =================
const cache = new Map();
function toCanvas(g) {
  const c = document.createElement('canvas');
  c.width = g.w;
  c.height = g.h;
  c.getContext('2d').putImageData(new ImageData(g.toRGBA(), g.w, g.h), 0, 0);
  return c;
}
function spr(kind, opts = {}) {
  const key = kind + JSON.stringify(opts);
  let c = cache.get(key);
  if (!c) { c = toCanvas(build(kind, opts)); cache.set(key, c); }
  return c;
}
function drawImg(img, x, y, scale = 3, rot = 0, alpha = 1, flip = false) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, (-img.width * scale) / 2, (-img.height * scale) / 2, img.width * scale, img.height * scale);
  ctx.restore();
}
// 玩家（上班族）：demo 用臨時像素圖
function worker(punch) {
  const g = new Grid(22, 24);
  g.blob(8, 6, 4.2, 4.4, 'f', { shade: 'F' });
  g.rect(4, 1, 9, 3, 'K');
  g.rect(4, 3, 2, 3, 'K');
  g.set(9, 6, 'e');
  g.set(11, 6, 'e');
  g.rect(5, 11, 7, 8, 'H');
  g.rect(8, 11, 1, 6, 'r');
  g.rect(5, 19, 3, 4, 'J');
  g.rect(9, 19, 3, 4, 'J');
  if (punch) { g.rect(12, 12, 6, 2, 'H'); g.blob(19, 12.5, 2, 2, 'f', { shade: 'F' }); } else { g.rect(12, 12, 2, 5, 'H'); g.rect(12, 17, 2, 2, 'f'); }
  g.outline();
  return toCanvas(g);
}
const WORKER = [worker(false), worker(true)];

// ================= 音效 =================
const Sound = {
  on: true,
  ctx: null,
  nb: null,
  unlock() {
    if (!this.on) return;
    try {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.out = this.ctx.createGain();
        this.out.gain.value = 0.5;
        this.out.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch { /* 沒有音效也能玩 */ }
  },
  tone(type, f0, f1, dur, vol = 0.12, delay = 0) {
    const c = this.ctx;
    const t = c.currentTime + delay;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.out);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.15, freq = 1200, type = 'bandpass', delay = 0) {
    const c = this.ctx;
    if (!this.nb) {
      const b = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
    }
    const t = c.currentTime + delay;
    const src = c.createBufferSource();
    src.buffer = this.nb;
    const f = c.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(this.out);
    src.start(t, Math.random() * 0.5, dur + 0.02);
  },
  play(name, p = 1) {
    if (!this.on || !this.ctx || this.ctx.state === 'closed') return;
    switch (name) {
      case 'slap': this.noise(0.07, 0.45, 2600 * p, 'highpass'); this.tone('triangle', 220 * p, 70, 0.1, 0.28); break;
      case 'bonk': this.tone('triangle', 300 * p, 80, 0.15, 0.32); this.noise(0.06, 0.25, 1500 * p); break;
      case 'punch': this.tone('sine', 150 * p, 45, 0.18, 0.5); this.noise(0.09, 0.4, 900 * p, 'lowpass'); break;
      case 'ko': this.noise(0.6, 0.45, 500, 'lowpass'); this.tone('sine', 140, 35, 0.5, 0.45); this.tone('square', 880, 1760, 0.25, 0.05, 0.1); break;
      case 'pop': this.tone('sine', 300 * p, 900 * p, 0.08, 0.1); break;
      case 'whoosh': this.noise(0.18, 0.15, 900); break;
      case 'blip': this.tone('square', 200 * p, 200 * p, 0.03, 0.025); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, f, 0.12, 0.06, i * 0.1)); break;
      default: break;
    }
  },
};
const sndBtn = document.getElementById('snd');
try { Sound.on = localStorage.getItem('beatboss-snd') !== '0'; } catch {}
const sndLabel = () => { sndBtn.textContent = '音效 ' + (Sound.on ? '開' : '關'); };
sndLabel();
sndBtn.addEventListener('click', () => {
  Sound.on = !Sound.on;
  sndLabel();
  Sound.unlock();
  sndBtn.blur();
  try { localStorage.setItem('beatboss-snd', Sound.on ? '1' : '0'); } catch {}
});

// ================= 今日出手（只會往上加） =================
const Count = {
  key: (() => { const t = new Date(); return `beatboss-hits-${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`; })(),
  n: 0,
  load() { try { this.n = Number(localStorage.getItem(this.key)) || 0; } catch {} },
  add(k = 1) { this.n += k; try { localStorage.setItem(this.key, String(this.n)); } catch {} },
};
Count.load();

// ================= 特效 =================
let floats = [], parts = [], glyphs = [], swings = [];
let shakeT = 0, shakeA = 0, flashT = 0, flashC = '#fff', freeze = 0;
function floatText(text, x, y, color = '#fff', size = 18) { floats.push({ text, x, y, t: 0, color, size }); }
function shake(a, t) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); }
function flash(c, t = 0.2) { flashC = c; flashT = t; }
function burst(img, x, y, n, { scale = 2, sp = 200, up = 260, life = [0.4, 0.8], grav = 700 } = {}) {
  for (let i = 0; i < n; i++) {
    parts.push({ img, x, y, vx: rand(-sp, sp), vy: rand(-up, -up * 0.2), r: rand(0, 6), vr: rand(-9, 9), t: 0, life: rand(...life), scale, grav });
  }
}
// 被打斷的話：一個字一個字噴出去
function glyphBurst(s, x, y, dir = 0) {
  const chars = [...s].filter((c) => c.trim()).slice(-12);
  chars.forEach((ch, i) => {
    glyphs.push({ ch, x: x + (i - chars.length / 2) * 13, y, vx: dir * rand(160, 360) + rand(-130, 130), vy: rand(-420, -160), r: 0, vr: rand(-10, 10), t: 0, life: rand(0.7, 1.1) });
  });
}
function swing(img, x0, y0, x1, y1, r0, r1, scale, life, flip = false) {
  swings.push({ img, x0, y0, x1, y1, r0, r1, scale, life, t: 0, flip });
}
function updateFx(dt) {
  floats.forEach((f) => (f.t += dt));
  floats = floats.filter((f) => f.t < 1.1);
  parts.forEach((p) => { p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; });
  parts = parts.filter((p) => p.t < p.life);
  glyphs.forEach((g) => { g.t += dt; g.vy += 800 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.r += g.vr * dt; });
  glyphs = glyphs.filter((g) => g.t < g.life);
  swings.forEach((s) => (s.t += dt));
  swings = swings.filter((s) => s.t < s.life + 0.06);
  shakeT -= dt;
  if (shakeT <= 0) shakeA = 0;
  flashT -= dt;
}
function drawFx() {
  parts.forEach((p) => drawImg(p.img, p.x, p.y, p.scale, p.r, 1 - p.t / p.life));
  glyphs.forEach((g) => {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.r);
    outlined(g.ch, 0, 0, 20, '#fffbe8', 1 - g.t / g.life);
    ctx.restore();
  });
  swings.forEach((s) => {
    const u = Math.min(1, s.t / s.life);
    const e = 1 - (1 - u) * (1 - u);
    drawImg(s.img, lerp(s.x0, s.x1, e), lerp(s.y0, s.y1, e), s.scale, lerp(s.r0, s.r1, e), s.t > s.life ? 1 - (s.t - s.life) / 0.06 : 1, s.flip);
  });
  floats.forEach((f) => {
    const a = f.t < 0.7 ? 1 : 1 - (f.t - 0.7) / 0.4;
    outlined(f.text, f.x, f.y - f.t * 40, f.size, f.color, a);
  });
}
function outlined(s, x, y, size, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 5);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1e1a24';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function txt(s, x, y, { size = 14, color = '#f3eee6', align = 'center', bold = false, base = 'middle', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${bold ? '700 ' : ''}${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function wrapText(s, maxW) {
  const out = [];
  let cur = '';
  for (const ch of s) {
    if (cur && ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function bubble(x, yb, s, st = {}) {
  ctx.save();
  const size = st.size || 15;
  ctx.font = `${st.bold ? '700 ' : ''}${size}px ${FONT}`;
  const lines = wrapText(s || ' ', st.maxW || 170);
  const lh = size * 1.3;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 20;
  const h = lines.length * lh + 12;
  const bx = clamp(x - w / 2, 6, LW - 6 - w);
  const by = yb - h - 10;
  const tx = clamp(x, bx + 14, bx + w - 14);
  ctx.fillStyle = st.bg || '#fffbe8';
  ctx.strokeStyle = st.border || '#3b2340';
  ctx.lineWidth = 2;
  rrect(bx, by, w, h, 10);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tx - 7, by + h - 1);
  ctx.lineTo(tx, by + h + 9);
  ctx.lineTo(tx + 7, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 7, by + h);
  ctx.lineTo(tx, by + h + 9);
  ctx.lineTo(tx + 7, by + h);
  ctx.stroke();
  ctx.fillStyle = st.fg || '#2a1830';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 6 + i * lh));
  ctx.restore();
}

// ================= 角色：台詞、受傷、講話 =================
const NAME = { alpaca: '羊駝', persimmon: '柿子', marketer: '清朝人' };
const TOP = { alpaca: 0, persimmon: 4, marketer: 0 };
const CPS = { alpaca: 0.07, persimmon: 0.1, marketer: 0.045 };
const LINES = {
  alpaca: {
    idle: ['這個很簡單吧？', '明天早上給我', '我沒有要聽你的理由', '這個我們再討論一下', '我們要做全球市場', '我只是提個想法', '週末弄一下就好'],
    hit: ['你知道我是誰嗎？', '小心你的績效考核！', '你是哪個部門的？', '我的毛！很貴的！'],
    rocket: ['等一下啊啊啊——', '我要飛去全球市場了——'],
  },
  persimmon: {
    idle: ['痾...你...有試過重開機嗎？', '這個喔...我...覺得', '這個...權限好像...不能開', '系統...沒問題，就是...是你的問題', '工單呢？', '這邊沒有收到你的工單'],
    hit: ['恩...喔....', '你被列入...黑名單了', 'IP 我記下了', '錯誤代碼 0x柿餅'],
    rocket: ['系統…過載…啊——', '這…不在…SOP裡——'],
  },
  marketer: {
    idle: ['這個要更有感', '不夠 wow', '這個我用AI就可以做了，很簡單的', '要有記憶點', '這個 KPI 很簡單', '注意你的品牌調性'],
    rant: ['然後我跟你說…', '這個我們之前就講過了', '重點是…', '我再補充一點', '等一下，我還沒講完', '所以說呢…', '你先聽我說完', '還有一件事'],
    hit: ['我的形象！', '這不在提案裡', '髮型就是品牌形象'],
    rocket: ['這聲量也太大了吧——', '我的髮型啊啊——'],
  },
};
function pickLine(kind) {
  const L = LINES[kind];
  return kind === 'marketer' && Math.random() < 0.5 ? pick(L.rant) : pick(L.idle);
}
function makeFoe(kind, x, y, scale, hp) {
  return { kind, x, y, scale, hp, maxHp: hp, rot: 0, rv: 0, ox: 0, ov: 0, face: 'normal', faceT: 0, talk: null, talkWait: rand(0.1, 0.5), hits: 0 };
}
// 受傷程度 d（0~1）→ 精靈圖狀態；全部量化，快取不會無限長
function foeSprite(f, now, d) {
  const o = { face: f.faceT > 0 ? f.face : d >= 0.75 ? 'dizzy' : 'normal' };
  const sw = Math.min(3, Math.floor(d * 4));
  if (sw) o.swell = sw;
  if (f.kind === 'alpaca') { const w = 4 - Math.min(4, Math.floor(d * 5)); if (w !== 4) o.wool = w; }
  if (f.kind === 'marketer') {
    const m = Math.min(3, Math.floor(d * 4));
    if (m) o.mess = m;
    if (d >= 0.5) o.nohat = true;
    if (f.talk && f.talk.ci < f.talk.text.length && Math.floor(now / 110) % 2) o.talk = true;
  }
  return spr(f.kind, o);
}
function dmgFx(kind, d0, d1, x, y, scale = 3) {
  if (kind === 'alpaca' && Math.floor(d0 * 5) < Math.floor(d1 * 5)) {
    burst(spr('woolPuff'), x, y, 6, { scale, up: 320, sp: 240, life: [0.7, 1.2], grav: 500 });
    floatText('我的毛！', x, y - 30, '#ffd84a', 16);
  }
  if (kind === 'marketer' && d0 < 0.5 && d1 >= 0.5) {
    parts.push({ img: spr('qingHat'), x, y: y - 10, vx: rand(-140, 140), vy: -560, r: 0, vr: rand(-9, 9), t: 0, life: 1.4, scale, grav: 900 });
    floatText('我的形象！', x, y - 30, '#ff6b6b', 16);
  }
  if (kind === 'persimmon' && d0 < 0.75 && d1 >= 0.75) floatText('藍屏了…', x, y - 30, '#9ec8ff', 16);
}
const headTop = (f) => f.y - 16 * f.scale + TOP[f.kind] * f.scale;
function updateFoe(f, dt) {
  f.faceT -= dt;
  f.rv += (-f.rot * 90 - f.rv * 9) * dt;
  f.rot += f.rv * dt;
  f.ov += (-f.ox * 120 - f.ov * 10) * dt;
  f.ox += f.ov * dt;
}
function newTalk(f, text) { f.talk = { text, ci: 0, t: 0, hold: 0 }; }
function shout(f, text) { f.talk = { text, ci: text.length, t: 0, hold: 0.2 }; }
function tickTalk(f, dt, blip = false) {
  if (!f.talk) {
    f.talkWait -= dt;
    if (f.talkWait <= 0) newTalk(f, pickLine(f.kind));
    return;
  }
  const tk = f.talk;
  if (tk.ci < tk.text.length) {
    tk.t += dt;
    while (tk.t >= CPS[f.kind] && tk.ci < tk.text.length) {
      tk.t -= CPS[f.kind];
      tk.ci++;
      if (blip && tk.ci % 2) Sound.play('blip', { alpaca: 0.9, persimmon: 1.3, marketer: 1.7 }[f.kind]);
    }
  } else {
    tk.hold += dt;
    if (tk.hold > 1.2) { f.talk = null; f.talkWait = rand(0.2, 0.6); }
  }
}
const talkText = (f) => (f.talk ? f.talk.text.slice(0, f.talk.ci) : '');
function cutTalk(f, x, y, dir) {
  if (!f.talk) return;
  glyphBurst(talkText(f), x, y, dir);
  f.talk = null;
  f.talkWait = rand(0.5, 0.9);
}
function drawWall(h) {
  ctx.fillStyle = '#2f2839';
  ctx.fillRect(0, 0, LW, LH);
  ctx.fillStyle = '#3d3449';
  ctx.fillRect(0, 0, LW, h);
  ctx.fillStyle = '#4b5d7a';
  ctx.fillRect(252, 46, 88, 58);
  ctx.strokeStyle = '#2a2333';
  ctx.lineWidth = 3;
  ctx.strokeRect(252, 46, 88, 58);
  ctx.beginPath(); ctx.moveTo(296, 46); ctx.lineTo(296, 104); ctx.stroke();
}
function hud(extra) {
  txt(`今日出手 ${Count.n}`, 16, 22, { align: 'left', size: 14, bold: true, color: '#ffd84a' });
  if (extra) txt(extra, 344, 22, { align: 'right', size: 13, color: '#bbb' });
}

// ================= D：來回巴掌 =================
const D = {
  help: '點畫面，或大拇指左右來回滑 = 一直甩巴掌。打倒換下一個。',
  ORDER: ['alpaca', 'persimmon', 'marketer'],
  init() {
    this.idx = 0;
    this.round = 0;
    this.combo = 0;
    this.comboT = 0;
    this.side = 1;
    this.drag = null;
    this.out = null;
    this.nextT = 0;
    this.lastSlap = 0;
    this.spawn();
  },
  spawn() {
    const kind = this.ORDER[this.idx % 3];
    const f = makeFoe(kind, 180, 372, 7, 24 + this.round * 8);
    f.ox = 280;
    this.f = f;
    newTalk(f, pickLine(kind));
  },
  slap(side) {
    const now = performance.now();
    if (now - this.lastSlap < 55) return;
    this.lastSlap = now;
    const f = this.f;
    const cy = f ? f.y - 20 : 340;
    swing(spr('hand'), 180 - side * 170, cy - 30, 180 + side * 20, cy, -side * 0.7, side * 0.2, 6, 0.1, side < 0);
    if (!f) {
      // 換人空檔：空揮不計數，但連打不斷
      Sound.play('whoosh');
      if (this.comboT > 0) this.comboT = 0.9;
      return;
    }
    this.combo++;
    this.comboT = 0.9;
    Count.add();
    Sound.play('slap', rand(0.85, 1.15) + Math.min(this.combo, 30) * 0.012);
    f.rv += side * 7;
    f.ov += side * 280;
    f.face = 'ouch';
    f.faceT = 0.3;
    const d0 = 1 - f.hp / f.maxHp;
    f.hp -= this.combo >= 15 ? 2 : 1;
    const d1 = clamp(1 - f.hp / f.maxHp, 0, 1);
    cutTalk(f, f.x, headTop(f) - 20, side);
    burst(spr('star'), f.x + side * 60, f.y - 30, 3, { scale: 3 });
    shake(2 + Math.min(this.combo, 12) * 0.35, 0.09);
    floatText(pick(['啪', '啪！', '啪啪']), f.x + rand(-80, 80), f.y - rand(50, 120), '#fff', 20 + Math.min(this.combo, 20));
    f.hits++;
    if (f.hits % 7 === 0) shout(f, pick(LINES[f.kind].hit));
    dmgFx(f.kind, d0, d1, f.x, f.y - 60, 5);
    if (f.hp <= 0) this.ko(side);
  },
  ko(side) {
    const f = this.f;
    freeze = 0.13;
    flash('#fff', 0.15);
    shake(14, 0.45);
    Sound.play('ko');
    floatText('KO！', 180, 220, '#ffd84a', 56);
    this.out = { f, dx: 0, dy: 0, vx: side * 520, vy: -950, r: 0, vr: side * 14, t: 0, line: pick(LINES[f.kind].rocket) };
    this.f = null;
    this.idx++;
    if (this.idx % 3 === 0) this.round++;
    this.nextT = 0.35;
  },
  update(dt) {
    this.comboT -= dt;
    if (this.comboT <= 0) this.combo = 0;
    if (this.f) { updateFoe(this.f, dt); tickTalk(this.f, dt, true); }
    if (this.out) {
      const o = this.out;
      o.t += dt; o.vy += 900 * dt; o.dx += o.vx * dt; o.dy += o.vy * dt; o.r += o.vr * dt;
      if (o.t > 1.6) this.out = null;
    }
    if (!this.f) { this.nextT -= dt; if (this.nextT <= 0) this.spawn(); }
  },
  down(x, y, isKey) {
    if (isKey) { this.side = -this.side; this.slap(this.side); return; }
    const side = x < 180 ? 1 : -1;
    this.side = side;
    this.slap(side);
    this.drag = { lx: x, acc: 0 };
  },
  move(x) {
    const d = this.drag;
    if (!d) return;
    d.acc += x - d.lx;
    d.lx = x;
    if (Math.abs(d.acc) > 30) { this.slap(Math.sign(d.acc)); d.acc = 0; }
  },
  up() { this.drag = null; },
  key(code) {
    if (code === 'ArrowLeft') this.slap(-1);
    else if (code === 'ArrowRight') this.slap(1);
    else this.down(null, null, true);
  },
  draw(now) {
    drawWall(500);
    ctx.fillStyle = '#e8e4dc';
    ctx.fillRect(20, 46, 116, 54);
    txt('Q4：全球市場', 78, 64, { size: 12, color: '#a32a3a', bold: true });
    txt('預算：—', 78, 84, { size: 11, color: '#555' });
    if (this.out) {
      const o = this.out;
      drawImg(foeSprite(o.f, now, 1), 180 + o.dx, 372 + o.dy, 7 * Math.max(0.3, 1 - o.t * 0.45), o.r);
      outlined(o.line, clamp(180 + o.dx * 0.5, 90, 270), 300 + o.dy * 0.4, 17, '#fff', 1 - o.t / 1.6);
    }
    const f = this.f;
    if (f) {
      const d = clamp(1 - f.hp / f.maxHp, 0, 1);
      drawImg(foeSprite(f, now, d), f.x + f.ox, f.y, f.scale, f.rot);
      const s = talkText(f);
      if (s) bubble(f.x + f.ox * 0.3, headTop(f) - 4, s, { size: 17, maxW: 230 });
      txt(NAME[f.kind], 180, 124, { size: 14, bold: true });
      ctx.fillStyle = '#1e1a24';
      rrect(40, 136, 280, 14, 7);
      ctx.fill();
      ctx.fillStyle = '#e04848';
      rrect(40, 136, Math.max(0, (280 * f.hp) / f.maxHp), 14, 7);
      ctx.fill();
    } else txt('下一位…', 180, 140, { size: 14, color: '#bbb' });
    hud(`第 ${this.round + 1} 輪`);
    if (this.combo >= 3) outlined(`${this.combo} 連打`, 180, 548, 24 + Math.min(this.combo, 30) * 0.6, this.combo >= 15 ? '#ff6b6b' : '#ffd84a');
    txt('點，或左右來回滑', 180, 612, { size: 12, color: '#888' });
  },
};

// ================= E：隔板冒頭 =================
const E = {
  help: '點畫面 = 拿拖鞋打。點哪裡都會打到離手指最近的那個。',
  SLOTS: [[62, 300], [180, 300], [298, 300], [62, 486], [180, 486], [298, 486]],
  HP: { alpaca: 1, persimmon: 1, marketer: 3 },
  STAY: { alpaca: 1.8, persimmon: 2.4, marketer: 2.8 },
  init() {
    this.slots = this.SLOTS.map(([x, y]) => ({ x, y, f: null, st: 'empty', t: 0, h: 0, stay: 0, hit: false, reboot: false }));
    this.dmg = { alpaca: 0, persimmon: 0, marketer: 0 };
    this.spawnT = 0;
    this.hitN = 0;
    this.rushN = 0;
  },
  pickKind() {
    const r = Math.random();
    return r < 0.45 ? 'alpaca' : r < 0.72 ? 'persimmon' : 'marketer';
  },
  pop(s, kind, instant = false) {
    kind = kind || this.pickKind();
    s.f = makeFoe(kind, s.x, s.y + 50, 3, this.HP[kind]);
    s.st = instant ? 'up' : 'rise';
    s.t = 0;
    s.h = instant ? 1 : 0;
    s.hit = false;
    s.stay = this.STAY[kind] * rand(0.8, 1.2);
    if (kind === 'persimmon') shout(s.f, '痾…'); else newTalk(s.f, pickLine(kind));
    Sound.play('pop', rand(0.9, 1.2));
  },
  ups() { return this.slots.filter((s) => s.st === 'rise' || s.st === 'up'); },
  nearest(list, x, y) {
    return list.reduce((a, b) => (Math.hypot(b.x - x, b.y - 40 - y) < Math.hypot(a.x - x, a.y - 40 - y) ? b : a));
  },
  update(dt) {
    const n = this.ups().length;
    const want = this.hitN > 30 ? 3 : 2;
    this.spawnT -= dt;
    if ((n < want && this.spawnT <= 0) || n === 0) {
      const empty = this.slots.filter((s) => s.st === 'empty');
      if (empty.length) { this.pop(pick(empty)); this.spawnT = rand(0.3, 0.7); }
    }
    for (const s of this.slots) {
      if (s.st === 'empty') continue;
      const f = s.f;
      updateFoe(f, dt);
      if (s.st === 'up') tickTalk(f, dt);
      s.t += dt;
      if (s.st === 'rise') {
        s.h = Math.min(1, s.t / (f.kind === 'persimmon' ? 0.45 : 0.14));
        if (s.h >= 1) { s.st = 'up'; s.t = 0; }
      } else if (s.st === 'up') {
        if (s.h < 1) s.h = Math.min(1, s.h + dt * 4);
        if (s.t > s.stay) { s.st = 'sink'; s.t = 0; }
      } else if (s.st === 'sink') {
        s.h = Math.max(0, 1 - s.t / (s.hit ? 0.12 : 0.25));
        if (s.h <= 0) {
          s.st = 'empty';
          s.f = null;
          if (s.reboot) {
            s.reboot = false;
            this.pop(s, 'persimmon');
            shout(s.f, '重開機完成');
          }
        }
      }
      if (s.f) s.f.y = s.y + 50 - s.h * 90;
    }
  },
  tap(x, y) {
    const cands = this.ups();
    let s;
    if (!cands.length) {
      const empty = this.slots.filter((q) => q.st === 'empty');
      if (empty.length) {
        s = x == null ? pick(empty) : this.nearest(empty, x, y);
        this.pop(s, null, true);
      } else {
        // 六個都在往下沉：把最近的那個拉回來再打一次
        const sinking = this.slots.filter((q) => q.f);
        s = x == null ? pick(sinking) : this.nearest(sinking, x, y);
        s.st = 'up'; s.h = 1; s.t = 0; s.reboot = false;
        s.f.hp = Math.max(1, s.f.hp);
      }
      s.f.y = s.y - 40;
    } else s = x == null ? pick(cands) : this.nearest(cands, x, y);
    this.hit(s);
  },
  hit(s) {
    const f = s.f;
    Count.add();
    this.hitN++;
    Sound.play('bonk', rand(0.85, 1.2));
    const hy = headTop(f);
    swing(spr('slipper'), s.x + 60, hy - 70, s.x + 8, hy + 6, -1.5, 0.3, 4.5, 0.09);
    burst(spr('star'), s.x, hy + 10, 4, { scale: 2.5 });
    shake(3, 0.08);
    floatText(pick(['啪！', '叩！', '咚！']), s.x + rand(-20, 20), hy - 26, '#fff', 20);
    cutTalk(f, s.x, hy - 10, 0);
    f.face = 'ouch';
    f.faceT = 0.5;
    f.rv += rand(-6, 6);
    const k = f.kind;
    const d0 = Math.min(1, this.dmg[k] / 30);
    this.dmg[k]++;
    dmgFx(k, d0, Math.min(1, this.dmg[k] / 30), s.x, hy + 10, 3);
    f.hp--;
    if (f.hp > 0) {
      s.st = 'up';
      s.h = 0.7;
      s.t = Math.min(s.t, s.stay - 1.4);
      shout(f, pick(['等一下，我還沒講完', '我再補充一點', '你先聽我說完']));
      return;
    }
    s.st = 'sink';
    s.t = 0;
    s.hit = true;
    if (k === 'persimmon' && Math.random() < 0.4) s.reboot = true;
    this.rushN++;
    if (this.rushN >= 25) {
      this.rushN = 0;
      floatText('開會囉！全員到齊', 180, 170, '#ffd84a', 26);
      Sound.play('win');
      for (const q of this.slots) if (q.st === 'empty') this.pop(q);
    }
  },
  down(x, y, isKey) { this.tap(isKey ? null : x, isKey ? null : y); },
  key() { this.tap(null, null); },
  draw(now) {
    drawWall(220);
    ctx.fillStyle = '#e8e4dc';
    ctx.fillRect(20, 46, 116, 54);
    txt('今日重點：', 78, 64, { size: 12, color: '#555', bold: true });
    txt('全部都很簡單', 78, 84, { size: 12, color: '#a32a3a' });
    for (const s of this.slots) {
      if (s.st !== 'empty') {
        const f = s.f;
        ctx.save();
        ctx.beginPath();
        ctx.rect(s.x - 62, s.y - 220, 124, 220);
        ctx.clip();
        drawImg(foeSprite(f, now, Math.min(1, this.dmg[f.kind] / 30)), s.x + f.ox, f.y, 3, f.rot);
        ctx.restore();
      }
      ctx.fillStyle = '#6f7a8c';
      rrect(s.x - 56, s.y, 112, 66, 4);
      ctx.fill();
      ctx.fillStyle = '#8c97a8';
      ctx.fillRect(s.x - 56, s.y, 112, 8);
      ctx.fillStyle = '#5c6474';
      ctx.fillRect(s.x - 56, s.y + 58, 112, 8);
    }
    for (const s of this.slots) {
      if (s.st === 'up' || s.st === 'rise') {
        const t = talkText(s.f);
        if (t) bubble(s.x, headTop(s.f) - 2, t, { size: 13, maxW: 104 });
      }
    }
    hud('拖鞋伺候');
    txt('點哪裡都打得到', 180, 612, { size: 12, color: '#888' });
  },
};

// ================= F：一路打下班 =================
const F = {
  help: '一直點就好：每點一下就衝過去揍擋路的人。走到打卡鐘就下班。',
  GY: 440,
  init() { this.day = 1; this.newDay(); },
  newDay() {
    this.px = 40;
    this.foes = [];
    this.len = 2000 + this.day * 300;
    this.done = 0;
    this.boost = 0;
    this.punchT = 0;
    this.dashT = 0;
    this.combo = 0;
    this.comboT = 0;
    let x = 320;
    while (x < this.len - 160) {
      const kind = pick(['alpaca', 'alpaca', 'persimmon', 'marketer']);
      const f = makeFoe(kind, x, this.GY - 48, 3, kind === 'marketer' ? 3 : 1);
      f.st = 'stand';
      this.foes.push(f);
      x += rand(130, 250);
    }
  },
  ahead() {
    let best = null;
    for (const f of this.foes) if (f.st === 'stand' && f.x > this.px - 10 && (!best || f.x < best.x)) best = f;
    return best;
  },
  tap() {
    if (this.done > 0) { this.done = 0; this.day++; this.newDay(); } // 慶祝中再點：直接開始下一天
    const f = this.ahead();
    if (f && f.x - this.px < 420) {
      this.dashFrom = this.px;
      this.px = f.x - 46;
      this.dashT = 0.1;
      this.punch(f);
    } else {
      this.boost = 0.35;
      Sound.play('whoosh');
      floatText('衝！', 90, this.GY - 120, '#fff', 18);
    }
  },
  punch(f) {
    Count.add();
    Sound.play('punch', rand(0.85, 1.15));
    this.punchT = 0.12;
    this.combo++;
    this.comboT = 1.2;
    shake(4, 0.1);
    burst(spr('star'), f.x - 24, f.y - 20, 4, { scale: 2.5 });
    cutTalk(f, f.x, headTop(f), 1);
    f.hp--;
    f.face = 'ouch';
    f.faceT = 0.5;
    if (f.hp > 0) {
      f.x += 44;
      f.ov += 260;
      shout(f, pick(['等一下，我還沒講完', '我再補充一點', '你先聽我說完']));
      return;
    }
    this.launch(f, false);
  },
  launch(f, chain) {
    const roll = f.kind === 'persimmon';
    f.st = roll ? 'roll' : 'fly';
    f.vx = roll ? 640 : rand(420, 560);
    f.vy = roll ? 0 : rand(-760, -540);
    f.vr = rand(10, 16);
    f.face = 'dizzy';
    f.faceT = 9;
    f.talk = null;
    floatText(chain ? '連環撞！' : roll ? '柿子滾出去了！' : pick(['飛！', '掰！', '出去！']), f.x, f.y - 80, chain ? '#ff6b6b' : '#ffd84a', chain ? 22 : 18);
    if (Math.random() < 0.6) f.cry = pick(LINES[f.kind].rocket);
  },
  update(dt) {
    if (this.done > 0) {
      this.done -= dt;
      if (this.done <= 0) { this.day++; this.newDay(); return; }
    }
    this.comboT -= dt;
    if (this.comboT <= 0) this.combo = 0;
    this.punchT -= dt;
    this.boost -= dt;
    this.dashT -= dt;
    const nx = this.ahead();
    const block = nx ? nx.x - 46 : Infinity;
    if (this.done <= 0) this.px = Math.min(this.px + (this.boost > 0 ? 420 : 110) * dt, block, this.len);
    for (const f of this.foes) {
      updateFoe(f, dt);
      if (f.st === 'stand') {
        if (f.x - this.px < 330) tickTalk(f, dt);
      } else if (f.st === 'fly') {
        f.vy += 1300 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
        if (f.y > 900) f.st = 'gone';
      } else if (f.st === 'roll') {
        f.x += f.vx * dt;
        f.rot += f.vr * dt;
        for (const g of this.foes) {
          if (g !== f && g.st === 'stand' && Math.abs(g.x - f.x) < 50) {
            g.hp = 0;
            Count.add();
            Sound.play('punch', 0.7);
            shake(6, 0.15);
            burst(spr('star'), g.x, g.y - 20, 6, { scale: 2.5 });
            this.launch(g, true);
          }
        }
        if (f.x - this.px > 700) f.st = 'gone';
      }
    }
    this.foes = this.foes.filter((f) => f.st !== 'gone');
    if (this.px >= this.len && this.done <= 0) {
      this.done = 1.8;
      Sound.play('win');
      floatText('準時下班！', 180, 230, '#62b047', 34);
      burst(spr('star'), 180, 260, 20, { scale: 3, sp: 300, up: 500 });
    }
  },
  down(x, y, isKey) { this.tap(); },
  key() { this.tap(); },
  draw(now) {
    const cam = this.px - 90;
    const GY = this.GY;
    ctx.fillStyle = '#3d3449';
    ctx.fillRect(0, 0, LW, GY);
    const start = Math.floor(cam / 200) * 200;
    for (let wx = start; wx < cam + LW + 200; wx += 200) {
      const sx = wx - cam;
      if ((wx / 200) % 2 === 0) {
        ctx.fillStyle = '#4b5d7a';
        ctx.fillRect(sx + 30, 170, 90, 70);
        ctx.strokeStyle = '#2a2333';
        ctx.lineWidth = 3;
        ctx.strokeRect(sx + 30, 170, 90, 70);
      } else {
        ctx.fillStyle = '#5c3424';
        ctx.fillRect(sx + 50, GY - 150, 60, 150);
        ctx.fillStyle = '#ffd84a';
        ctx.fillRect(sx + 98, GY - 80, 6, 6);
        txt('會議室', sx + 80, GY - 166, { size: 11, color: '#999' });
      }
    }
    ctx.fillStyle = '#2b2433';
    ctx.fillRect(0, GY, LW, LH - GY);
    ctx.fillStyle = '#342c3f';
    for (let wx = Math.floor(cam / 60) * 60; wx < cam + LW + 60; wx += 60) ctx.fillRect(wx - cam, GY, 30, 14);
    // 打卡鐘與出口
    const ex = this.len + 50 - cam;
    if (ex < LW + 120) {
      ctx.fillStyle = '#2f6b3a';
      ctx.fillRect(ex, GY - 160, 80, 160);
      txt('出口', ex + 40, GY - 176, { size: 14, bold: true, color: '#62b047' });
      ctx.fillStyle = '#e8e4dc';
      ctx.fillRect(ex - 40, GY - 110, 34, 44);
      txt('打卡', ex - 23, GY - 88, { size: 11, color: '#3b2340', bold: true });
    }
    for (const f of this.foes) {
      const sx = f.x - cam + f.ox;
      if (sx < -80 || sx > LW + 80) continue;
      drawImg(foeSprite(f, now, f.st === 'stand' ? (f.maxHp - f.hp) / f.maxHp : 1), sx, f.y, 3, f.rot, 1, true);
      if (f.cry && f.st !== 'stand') outlined(f.cry, clamp(sx, 70, 290), f.y - 70, 14, '#fff');
    }
    if (this.dashT > 0) {
      for (let i = 1; i <= 3; i++) drawImg(WORKER[1], lerp(this.dashFrom, this.px, i / 4) - cam, GY - 36, 3, 0, 0.18 * i);
    }
    drawImg(WORKER[this.punchT > 0 ? 1 : 0], this.px - cam, GY - 36 - (this.punchT > 0 ? 0 : Math.abs(Math.sin(now / 120)) * 3), 3);
    for (const f of this.foes) {
      if (f.st !== 'stand') continue;
      const sx = f.x - cam;
      const t = talkText(f);
      if (t && sx > -40 && sx < LW + 40) bubble(sx, headTop(f) - 2, t, { size: 13, maxW: 130 });
    }
    // 進度條：你 → 打卡鐘
    const u = clamp(this.px / this.len, 0, 1);
    ctx.fillStyle = '#1e1a24';
    rrect(40, 52, 250, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#62b047';
    rrect(40, 52, 250 * u, 10, 5);
    ctx.fill();
    const mins = Math.floor(30 * u);
    txt(`17:${String(30 + Math.min(29, mins)).padStart(2, '0')}`, 300, 57, { align: 'left', size: 13, bold: true, color: '#ffd84a' });
    txt('打卡鐘 →', 290, 76, { align: 'right', size: 11, color: '#888' });
    hud(`第 ${this.day} 天`);
    if (this.combo >= 3) outlined(`${this.combo} 連揍`, 180, 520, 24 + Math.min(this.combo, 20) * 0.6, '#ffd84a');
    txt('一直點就好', 180, 612, { size: 12, color: '#888' });
    if (this.done > 0) outlined('準時下班！', 180, 300, 36, '#62b047');
  },
};

// ================= 切換、輸入、主迴圈 =================
const MODES = { D, E, F };
let mode = D;
function setMode(k) {
  mode = MODES[k];
  floats = [];
  parts = [];
  glyphs = [];
  swings = [];
  shakeT = 0;
  flashT = 0;
  freeze = 0;
  mode.init();
  helpEl.textContent = mode.help;
  document.querySelectorAll('header button[data-m]').forEach((b) => b.classList.toggle('on', b.dataset.m === k));
  try { localStorage.setItem('beatboss-demo2', k); } catch {}
  resize();
}
document.querySelectorAll('header button[data-m]').forEach((btn) => {
  btn.addEventListener('click', () => { setMode(btn.dataset.m); btn.blur(); });
});
addEventListener('error', (e) => { window.__demoErr = String(e.message); });
window.__demo = { mode: () => mode, count: () => Count.n, audio: () => (Sound.ctx ? Sound.ctx.state : 'none') };

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * LW, y: ((e.clientY - r.top) / r.height) * LH };
}
let activePtr = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  Sound.unlock();
  if (activePtr !== null) return;
  activePtr = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch {}
  const p = toLogical(e);
  mode.down?.(p.x, p.y, false);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePtr) return;
  const p = toLogical(e);
  mode.move?.(p.x, p.y);
});
function endPtr(e) {
  Sound.unlock(); // 手機觸控要在放開時才算使用者手勢
  if (e.pointerId !== activePtr) return;
  activePtr = null;
  const p = toLogical(e);
  mode.up?.(p.x, p.y, e.type === 'pointercancel');
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && !e.code.startsWith('Arrow')) return;
  e.preventDefault();
  Sound.unlock();
  if (e.repeat) return;
  mode.key?.(e.code);
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (freeze > 0) freeze -= dt;
  else {
    mode.update(dt, now);
    updateFx(dt);
  }
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2f2839';
  ctx.fillRect(0, 0, LW, LH);
  if (shakeT > 0) ctx.translate(rand(-shakeA, shakeA), rand(-shakeA, shakeA));
  mode.draw(now);
  drawFx();
  if (flashT > 0) {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.globalAlpha = Math.min(1, flashT * 3);
    ctx.fillStyle = flashC;
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

resize();
let startMode = 'D';
try { startMode = localStorage.getItem('beatboss-demo2') || 'D'; } catch {}
setMode(MODES[startMode] ? startMode : 'D');
requestAnimationFrame(frame);
</script>
</body>
</html>
