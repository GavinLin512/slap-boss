<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>三本柱單手 Demo</title>
<style>
  :root { --bg:#1e1a24; --fg:#f3eee6; --line:#5a4d66; --accent:#f5892a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body {
    display:flex; flex-direction:column; align-items:center;
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  header { display:flex; gap:6px; padding:10px 8px 6px; }
  header button {
    font:inherit; font-size:14px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--line); background:#2c2535; color:var(--fg); cursor:pointer;
  }
  header button.on { background:var(--accent); border-color:var(--accent); color:#1e1a24; font-weight:700; }
  #help { font-size:13px; line-height:1.45; opacity:.85; padding:0 16px 8px; text-align:center; max-width:440px; min-height:38px; }
  #wrap { flex:1; min-height:0; width:100%; display:flex; justify-content:center; align-items:flex-start; padding-bottom:8px; box-sizing:border-box; }
  canvas { display:block; touch-action:none; border-radius:12px; }
</style>
</head>
<body>
<header>
  <button data-m="A">A 插不上話</button>
  <button data-m="B">B 甩鍋大會</button>
  <button data-m="C">C 忍住不爆氣</button>
</header>
<div id="help"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script type="module">
import { build, Grid } from './sprites.js';

// ================= 共用：畫布、座標 =================
const LW = 360, LH = 640;
const FONT = '-apple-system, "PingFang TC", "Noto Sans TC", sans-serif';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const helpEl = document.getElementById('help');
let K = 1;

function resize() {
  const wrap = document.getElementById('wrap');
  const s = Math.min(Math.min(innerWidth, 520) / LW, (wrap.clientHeight - 8) / LH);
  cv.style.width = LW * s + 'px';
  cv.style.height = LH * s + 'px';
  K = s * (devicePixelRatio || 1);
  cv.width = Math.round(LW * K);
  cv.height = Math.round(LH * K);
}
addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;

// ================= 精靈圖 =================
const cache = new Map();
function toCanvas(g) {
  const c = document.createElement('canvas');
  c.width = g.w;
  c.height = g.h;
  c.getContext('2d').putImageData(new ImageData(g.toRGBA(), g.w, g.h), 0, 0);
  return c;
}
function spr(kind, opts = {}) {
  const key = kind + JSON.stringify(opts);
  let c = cache.get(key);
  if (!c) {
    c = toCanvas(build(kind, opts));
    cache.set(key, c);
  }
  return c;
}
function drawImg(img, x, y, scale = 3, rot = 0, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.drawImage(img, (-img.width * scale) / 2, (-img.height * scale) / 2, img.width * scale, img.height * scale);
  ctx.restore();
}
// 鍋：demo 用的臨時像素圖
const WOK = (() => {
  const g = new Grid(22, 12);
  g.blob(11, 2, 8, 8, 'Z', { shade: 'K', clip: (x, y) => y >= 4 });
  g.rect(3, 4, 16, 1, 'a');
  g.rect(1, 4, 2, 1, 'd');
  g.rect(19, 4, 2, 1, 'd');
  g.outline();
  return toCanvas(g);
})();

// ================= 共用特效 =================
let floats = [], parts = [], shakeT = 0, shakeA = 0, flashT = 0, flashC = '#fff';
function floatText(text, x, y, color = '#fff', size = 18) {
  floats.push({ text, x, y, t: 0, color, size });
}
function shake(a, t) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); }
function flash(c, t = 0.25) { flashC = c; flashT = t; }
function stars(x, y, n) {
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, vx: rand(-170, 170), vy: rand(-260, -60), t: 0, life: rand(0.4, 0.75), r: rand(0, 6), vr: rand(-9, 9) });
  }
}
function updateFx(dt) {
  floats.forEach((f) => (f.t += dt));
  floats = floats.filter((f) => f.t < 1.1);
  parts.forEach((p) => { p.t += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; });
  parts = parts.filter((p) => p.t < p.life);
  shakeT -= dt;
  if (shakeT <= 0) shakeA = 0;
  flashT -= dt;
}
function drawFx() {
  parts.forEach((p) => drawImg(spr('star'), p.x, p.y, 2, p.r, 1 - p.t / p.life));
  floats.forEach((f) => {
    const a = f.t < 0.7 ? 1 : 1 - (f.t - 0.7) / 0.4;
    outlined(f.text, f.x, f.y - f.t * 40, f.size, f.color, a);
  });
}
function outlined(s, x, y, size, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1e1a24';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function txt(s, x, y, { size = 14, color = '#f3eee6', align = 'center', bold = false, base = 'middle', alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${bold ? '700 ' : ''}${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function wrapText(s, maxW) {
  const out = [];
  let cur = '';
  for (const ch of s) {
    if (cur && ctx.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
// 對話框：x 是說話者中心，yb 是框底（尾巴指向下方）
function bubble(x, yb, s, st = {}) {
  ctx.save();
  const size = st.size || 15;
  ctx.font = `${st.bold ? '700 ' : ''}${size}px ${FONT}`;
  const lines = wrapText(s || ' ', st.maxW || 170);
  const lh = size * 1.3;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 20 + (st.padR || 0);
  const h = lines.length * lh + 14;
  const bx = clamp(x - w / 2, 6, LW - 6 - w);
  const by = yb - h - 10;
  const tx = clamp(x, bx + 14, bx + w - 14);
  ctx.globalAlpha = st.alpha ?? 1;
  ctx.fillStyle = st.bg || '#fffbe8';
  ctx.strokeStyle = st.border || '#3b2340';
  ctx.lineWidth = st.lw || 2;
  rrect(bx, by, w, h, 10);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tx - 7, by + h - 1);
  ctx.lineTo(tx, by + h + 9);
  ctx.lineTo(tx + 7, by + h - 1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 7, by + h);
  ctx.lineTo(tx, by + h + 9);
  ctx.lineTo(tx + 7, by + h);
  ctx.stroke();
  ctx.fillStyle = st.fg || '#2a1830';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + 10, by + 7 + i * lh));
  ctx.restore();
  return { x: bx, y: by, w, h };
}

// ================= 共用：三個角色 =================
const KINDS = ['alpaca', 'persimmon', 'marketer'];
const NAME = { alpaca: '羊駝', persimmon: '柿子', marketer: '清朝人' };
const SLOT_X = [62, 180, 298];
const TOP = { alpaca: 0, persimmon: 4, marketer: 0 };
const HIT_LINE = {
  alpaca: ['你知道我是誰嗎？', '小心你的績效考核！', '咳...咳咳！'],
  persimmon: ['恩...喔....', 'IP 我記下了', '你被列入...黑名單了'],
  marketer: ['我的形象！', '這不在提案裡', '注意你的品牌調性'],
};
const headY = (b) => b.y - 48 + TOP[b.kind] * 3;
function makeBosses(y) {
  return KINDS.map((kind, i) => ({ kind, i, x: SLOT_X[i], y, face: 'normal', faceT: 0, swell: 0, hitT: 0, talking: false, nohat: false, fly: null, react: null, stack: 0 }));
}
function hurt(b, swell = 1, face = 'ouch', t = 0.6) {
  b.face = face;
  b.faceT = t;
  b.swell = Math.min(3, b.swell + swell);
  b.hitT = 0.25;
}
function react(b, text, t = 1.1) { b.react = { text, t }; }
function launch(b) {
  const dir = b.i === 0 ? -1 : b.i === 2 ? 1 : pick([-1, 1]);
  b.fly = { t: 0, dx: 0, dy: 0, vx: dir * rand(140, 240), vy: -820, r: 0, vr: dir * rand(9, 14) };
  b.talking = false;
}
function updateBoss(b, dt) {
  b.faceT -= dt;
  b.hitT -= dt;
  b.swell = Math.max(0, b.swell - dt * 0.35);
  if (b.react) { b.react.t -= dt; if (b.react.t <= 0) b.react = null; }
  if (b.fly) {
    const f = b.fly;
    f.t += dt;
    f.vy += 320 * dt;
    f.dx += f.vx * dt;
    f.dy += f.vy * dt;
    f.r += f.vr * dt;
    if (f.t > 3.2) {
      b.fly = null;
      b.faceT = 0;
      b.swell = 0;
      floatText(`${NAME[b.kind]}回來了`, b.x, b.y - 50, '#bbb', 13);
    }
  }
}
function drawBoss(b, now) {
  let x = b.x, y = b.y, rot = 0, sc = 3;
  if (b.fly) {
    if (b.fly.t > 2.2) return;
    x += b.fly.dx;
    y += b.fly.dy;
    rot = b.fly.r;
    sc = 3 * Math.max(0.25, 1 - b.fly.t * 0.35);
  }
  if (b.downT > 0) { rot = 1.3 * Math.min(1, (2 - b.downT) * 5) * (b.i === 2 ? 1 : -1); y += 20; }
  if (b.hitT > 0) x += rand(-3, 3);
  if (b.talking) y += Math.sin(now / 70) * 1.5;
  const o = { face: b.faceT > 0 ? b.face : 'normal' };
  const sw = Math.ceil(b.swell);
  if (sw > 0) o.swell = sw;
  if (b.kind === 'marketer') {
    if (b.talking && Math.floor(now / 110) % 2) o.talk = true;
    if (b.nohat) o.nohat = true;
  }
  drawImg(spr(b.kind, o), x, y, sc, rot);
}
function drawReacts(bs, lift = () => 0) {
  bs.forEach((b) => {
    if (b.react && !b.fly) bubble(b.x, headY(b) - 4 - lift(b), b.react.text, { size: 13, bg: '#3b2340', fg: '#fffbe8', border: '#fffbe8', alpha: Math.min(1, b.react.t * 3) });
  });
}
function drawRoom(tableY) {
  ctx.fillStyle = '#2f2839';
  ctx.fillRect(0, 0, LW, LH);
  ctx.fillStyle = '#3d3449';
  ctx.fillRect(0, 0, LW, tableY ? tableY - 6 : 300);
  // 窗戶
  ctx.fillStyle = '#4b5d7a';
  ctx.fillRect(252, 18, 88, 58);
  ctx.strokeStyle = '#2a2333';
  ctx.lineWidth = 3;
  ctx.strokeRect(252, 18, 88, 58);
  ctx.beginPath(); ctx.moveTo(296, 18); ctx.lineTo(296, 76); ctx.stroke();
  // 白板
  ctx.fillStyle = '#e8e4dc';
  ctx.fillRect(20, 20, 116, 54);
  txt('Q4：全球市場', 78, 38, { size: 12, color: '#a32a3a', bold: true });
  txt('預算：—', 78, 58, { size: 11, color: '#555' });
}
function drawTable(y) {
  ctx.fillStyle = '#7a4a32';
  ctx.fillRect(12, y, 336, 24);
  ctx.fillStyle = '#5c3424';
  ctx.fillRect(12, y + 24, 336, 8);
}

// ================= C：忍住不爆氣 =================
const C = {
  help: '按住畫面 = 忍（火氣開始累積）。放開 = 爆氣，打「正在講話」的人，火氣越滿打越狠。到 100% 會當場失控。空白鍵按住也可以。',
  LINES: {
    alpaca: ['這個很簡單吧？', '明天早上給我', '我們要做全球市場', '週末弄一下就好', '我只是提個想法'],
    persimmon: [['痾', '你', '有試過', '重開機嗎？'], ['系統', '沒問題', '就是', '是你的問題'], ['這邊', '沒有收到', '你的', '工單']],
    marketer: ['這個要更有感', '不夠 wow', '然後我跟你說…', '要有記憶點', '重點是…', '這個 KPI 很簡單', '我簡單講兩句', '注意你的品牌調性', '所以說呢…', '這個我用AI就可以做了'],
  },
  init() {
    this.bs = makeBosses(208);
    this.rage = 0;
    this.holding = false;
    this.wantHold = false;
    this.cool = 0;
    this.score = 0;
    this.cur = null;
    this.gap = 0.6;
    this.last = null;
    this.failT = 0;
  },
  startLine() {
    const avail = this.bs.filter((b) => !b.fly);
    if (!avail.length) { this.gap = 0.3; return; }
    let b = pick(avail);
    if (avail.length > 1 && b === this.last && Math.random() < 0.6) b = pick(avail.filter((x) => x !== b));
    const L = this.LINES[b.kind];
    let segs;
    if (b.kind === 'alpaca') {
      segs = [{ text: pick(L), cps: 0.08, gain: 0, pause: 0.05 }];
    } else if (b.kind === 'persimmon') {
      const l = pick(L);
      segs = l.map((t, i) => {
        const lastSeg = i === l.length - 1;
        return { text: t, cps: lastSeg ? 0.07 : 0.11, gain: lastSeg ? 26 / t.length : 0.6, pause: lastSeg ? 0.05 : rand(0.45, 0.9), dots: !lastSeg };
      });
    } else {
      const n = 3 + Math.floor(Math.random() * 2);
      segs = [];
      for (let i = 0; i < n; i++) segs.push({ text: pick(L) + (i < n - 1 ? '，' : ''), cps: 0.05, gain: 0, pause: 0.05 });
    }
    this.cur = { b, segs, si: 0, ci: 0, t: 0, phase: 'say', shown: '', talkT: 0, extra: false };
    b.talking = true;
    this.last = b;
  },
  gain(v) {
    if (this.holding) this.rage += v;
  },
  tickLine(dt) {
    const c = this.cur, b = c.b;
    c.talkT += dt;
    if (b.kind === 'marketer') {
      this.gain((4 + 7 * c.talkT) * dt); // 越講越快
      if (this.holding && !c.extra && this.rage >= 82) {
        c.extra = true;
        if (Math.random() < 0.75) {
          c.segs.splice(c.si + 1, 0, { text: '我再補充一點！', cps: 0.04, gain: 0, pause: 0.05 });
          this.gain(12);
          floatText('+12', 30 + 300 * Math.min(1, this.rage / 100), 318, '#ff6b6b', 16);
        }
      }
    }
    if (c.phase === 'pause') {
      c.t -= dt;
      if (c.t <= 0) {
        if (c.segs[c.si].dots) c.shown += '...';
        c.si++;
        c.ci = 0;
        c.t = 0;
        c.phase = 'say';
        if (c.si >= c.segs.length) this.endLine();
      }
      return;
    }
    const seg = c.segs[c.si];
    c.t += dt;
    while (c.t >= seg.cps && c.ci < seg.text.length) {
      c.t -= seg.cps;
      c.shown += seg.text[c.ci++];
      if (seg.gain) this.gain(seg.gain);
    }
    if (c.ci >= seg.text.length) { c.phase = 'pause'; c.t = seg.pause; }
  },
  endLine() {
    const b = this.cur.b;
    b.talking = false;
    if (b.kind === 'alpaca' && this.holding) {
      this.gain(16);
      floatText('+16', 30 + 300 * Math.min(1, this.rage / 100), 318, '#ffc070', 16);
    }
    this.cur = null;
    this.gap = rand(0.35, 0.8);
  },
  cancelLine() {
    if (!this.cur) return;
    this.cur.b.talking = false;
    this.cur = null;
    this.gap = rand(0.6, 1);
  },
  update(dt) {
    this.bs.forEach((b) => updateBoss(b, dt));
    if (this.failT > 0) {
      this.failT -= dt;
      if (this.failT <= 0) { this.rage = 0; this.score = 0; }
      return;
    }
    this.cool -= dt;
    if (this.wantHold && this.cool <= 0) { this.wantHold = false; this.holding = true; }
    if (!this.cur) { this.gap -= dt; if (this.gap <= 0) this.startLine(); } else this.tickLine(dt);
    if (this.rage >= 100) this.fail();
  },
  down() {
    if (this.failT > 0) return;
    if (this.cool > 0) { this.wantHold = true; return; }
    this.holding = true;
  },
  up() {
    this.wantHold = false;
    if (!this.holding) return;
    this.holding = false;
    this.release();
  },
  release() {
    const r = this.rage;
    this.rage = 0;
    this.cool = 0.35;
    const b = this.cur ? this.cur.b : this.last;
    if (r < 6) return;
    if (!b || b.fly) { floatText('沒人在講話…', 180, 380, '#bbb', 15); return; }
    const pts = Math.round(r < 30 ? r : r < 70 ? r * 1.5 : r * (r >= 95 ? 6 : 3));
    this.score += pts;
    const hy = headY(b);
    if (r < 30) {
      hurt(b, 1);
      outlinedFloat('啪', b, '#fff', 22);
      stars(b.x, b.y - 10, 3);
      shake(3, 0.12);
      react(b, pick(HIT_LINE[b.kind]));
    } else if (r < 70) {
      hurt(b, 3, 'dizzy', 1.4);
      outlinedFloat('啪啪啪！', b, '#ffd84a', 24);
      stars(b.x, b.y - 10, 9);
      shake(6, 0.25);
      if (this.cur && this.cur.b === b) this.cancelLine();
      react(b, pick(HIT_LINE[b.kind]));
    } else {
      hurt(b, 3, 'dizzy', 3);
      outlinedFloat(r >= 95 ? '神準！打飛出窗外！' : '打飛！', b, '#ff6b6b', 24);
      stars(b.x, b.y - 10, 16);
      shake(11, 0.4);
      flash('#fff', 0.12);
      if (this.cur && this.cur.b === b) this.cancelLine();
      launch(b);
    }
    floatText(`+${pts}`, b.x, hy + 120, '#ffd84a', 15);
  },
  fail() {
    this.holding = false;
    this.failT = 2.2;
    this.rage = 100;
    flash('#e04848', 0.5);
    shake(12, 0.6);
    this.bs.forEach((b) => { if (!b.fly) { hurt(b, 0, 'shock', 2); b.talking = false; } });
    this.cur = null;
    this.gap = 2.4;
  },
  draw(now) {
    const TY = 244;
    drawRoom(TY);
    this.bs.forEach((b) => drawBoss(b, now));
    drawTable(TY);
    const c = this.cur;
    if (c) {
      const b = c.b;
      let s = c.shown + (c.phase === 'pause' && c.segs[c.si] && c.segs[c.si].dots ? '...' : '');
      if (s.length > 30) s = '…' + s.slice(-29);
      bubble(b.x, headY(b) - 4, s || ' ');
    }
    drawReacts(this.bs);

    // 下半部：目標、火氣條、按鈕
    txt(`分數 ${this.score}`, 16, 296, { align: 'left', size: 13, color: '#bbb' });
    const tb = c ? c.b : this.last && !this.last.fly ? this.last : null;
    txt(tb ? `放開會打：${NAME[tb.kind]}${c ? '' : '（剛講完）'}` : '（換人講話中）', 344, 296, { align: 'right', size: 14, bold: true, color: tb ? '#ffd84a' : '#888' });

    const r = clamp(this.rage, 0, 100);
    const bx = 30, by = 326, bw = 300, bh = 28;
    const jx = this.holding && r > 80 ? rand(-2, 2) : 0;
    ctx.fillStyle = '#1e1a24';
    rrect(bx + jx, by, bw, bh, 8);
    ctx.fill();
    const col = r < 30 ? '#62b047' : r < 70 ? '#f5892a' : r < 95 ? '#e04848' : (Math.floor(now / 80) % 2 ? '#ff2b2b' : '#fff');
    ctx.fillStyle = col;
    rrect(bx + jx, by, (bw * r) / 100, bh, 8);
    ctx.fill();
    [30, 70, 95].forEach((m) => {
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillRect(bx + (bw * m) / 100 - 1, by - 4, 2, bh + 8);
    });
    txt(`火氣 ${Math.floor(r)}%`, 180, by + bh / 2, { size: 14, bold: true, color: '#fff' });
    const tiers = [[15, '啪'], [50, '連打'], [82, '打飛'], [97.5, '神準']];
    tiers.forEach(([p, s]) => txt(s, bx + (bw * p) / 100, by + bh + 16, { size: 12, color: '#bbb' }));

    const cx = 180, cy = 486;
    const tr = this.holding ? r / 30 : 0;

const B = {

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * LW, y: ((e.clientY - r.top) / r.height) * LH };
}
let activePtr = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (activePtr !== null) return;
  activePtr = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch {}
  const p = toLogical(e);
  mode.down?.(p.x, p.y, false);
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== activePtr) return;
  const p = toLogical(e);
  mode.move?.(p.x, p.y);
});
function endPtr(e) {
  if (e.pointerId !== activePtr) return;
  activePtr = null;
  const p = toLogical(e);
  mode.up?.(p.x, p.y, e.type === 'pointercancel');
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) mode.down?.(null, null, true);
  } else if (e.code.startsWith('Arrow')) {
    e.preventDefault();
    if (!e.repeat) mode.key?.(e.code);
  }
});
addEventListener('keyup', (e) => {
  if (e.code === 'Space') { e.preventDefault(); mode.up?.(null, null, false); }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  mode.update(dt, now);
  updateFx(dt);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2f2839';
  ctx.fillRect(0, 0, LW, LH);
  if (shakeT > 0) ctx.translate(rand(-shakeA, shakeA), rand(-shakeA, shakeA));
  mode.draw(now);
  drawFx();
  if (flashT > 0) {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.globalAlpha = Math.min(1, flashT * 3);
    ctx.fillStyle = flashC;
    ctx.fillRect(0, 0, LW, LH);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

resize();
let startMode = 'C';
try { startMode = localStorage.getItem('beatboss-demo') || 'C'; } catch {}
setMode(MODES[startMode] ? startMode : 'C');
requestAnimationFrame(frame);
</script>
</body>
</html>
